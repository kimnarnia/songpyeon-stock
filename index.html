<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송편 주식운세</title>
<style>
  @font-face {
    font-family: 'SchoolSafetyRoundedSmile';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-R.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SchoolSafetyRoundedSmile';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root{
    --moon:#FFF6E5;
    --sky-top:#2b3a67;
    --sky-bot:#5c6ea8;
    --cream:#FFF8ED;
    --navy:#2b3a67;
    --blue:#7e97c2;
    --blue-dark:#5c6ea8;
    --accent:#e8a33d;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  button{font-family:inherit;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"SchoolSafetyRoundedSmile","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:var(--cream);
    color:var(--navy);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 0;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:0 20px;
  }
  .sky{
    position:relative;
    overflow:hidden;
    border-radius:24px 24px 0 0;
    padding:16px 0 20px;
    background:
      radial-gradient(circle at 50% -10%, #ffe9b8 0%, rgba(255,233,184,0) 45%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
  }
  .moon{
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffdf5, var(--moon) 60%, #ffe9ba 100%);
    box-shadow:
      0 0 14px 5px rgba(255,244,214,0.5),
      0 0 26px 9px rgba(255,230,170,0.24);
    margin:0 auto 8px;
    position:relative;
    animation:moonGlow 4.5s ease-in-out infinite;
  }
  @keyframes moonGlow{
    0%,100%{
      box-shadow:
        0 0 14px 5px rgba(255,244,214,0.45),
        0 0 26px 9px rgba(255,230,170,0.2);
    }
    50%{
      box-shadow:
        0 0 20px 7px rgba(255,244,214,0.7),
        0 0 36px 14px rgba(255,230,170,0.32);
    }
  }
  .stars{
    position:absolute; top:0; left:0;
    width:100%; height:100%; pointer-events:none;
  }
  .stars span{
    position:absolute; width:3px; height:3px; background:#fff; border-radius:50%;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.2; }
    50%{ opacity:1; }
  }
  h1{
    text-align:center;
    font-size:22px;
    margin:2px 0 2px;
    color:#fff;
    letter-spacing:-0.5px;
    text-shadow:0 2px 10px rgba(43,58,103,0.55);
  }
  .subtitle{
    text-align:center;
    color:#dbe2f5;
    font-size:13px;
    margin:0 0 12px;
  }
  .card{
    background:var(--card);
    border-radius:24px;
    padding:18px 16px 16px;
    box-shadow:0 14px 34px rgba(43,58,103,0.18);
    text-align:center;
    animation:cardIn .6s ease both;
  }
  @keyframes cardIn{
    0%{ opacity:0; transform:translateY(24px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .stage{
    width:62%;
    max-width:220px;
    margin:0 auto;
    aspect-ratio:1/1;
    border-radius:18px;
    overflow:hidden;
    background:#ffffff;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage video{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .video-bob{
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .stage .idle-hint{
    position:absolute;
    bottom:8px;
    left:0;right:0;
    text-align:center;
    font-size:12px;
    color:var(--blue-dark);
    background:rgba(255,255,255,0.85);
    padding:4px 0;
    font-weight:600;
  }
  .make-btn{
    margin-top:12px;
    width:100%;
    border:none;
    border-radius:16px;
    padding:13px 0;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--blue-dark),var(--navy));
    box-shadow:0 8px 18px rgba(92,110,168,0.4);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .make-btn:active{transform:translateY(2px) scale(0.99);}
  .make-btn:disabled{opacity:.55; cursor:default;}
  .btn-row{
    display:none;
    gap:10px;
    margin-top:16px;
  }
  .again-btn{
    flex:1;
    border:2px solid var(--blue-dark);
    border-radius:16px;
    padding:11px 0;
    font-size:14px;
    font-weight:700;
    color:var(--blue-dark);
    background:#fff;
    cursor:pointer;
    transition:transform .12s ease, opacity .2s ease;
  }
  .again-btn:active{transform:translateY(2px) scale(0.99);}
  .again-btn.is-disabled{
    opacity:.4;
    border-color:#b7c0d6;
    color:#b7c0d6;
  }
  .share-btn{
    flex:1;
    border:none;
    border-radius:16px;
    padding:11px 0;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),#d98f22);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .share-btn:active{transform:translateY(2px) scale(0.99);}
  .share-btn:disabled{
    opacity:.45;
    cursor:default;
    background:linear-gradient(135deg,#c7ccd6,#a9aeb8);
  }
  .btn-pulse{
    animation:btnPulse .35s ease;
  }
  @keyframes btnPulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(.94); }
    65%{ transform:scale(1.04); }
    100%{ transform:scale(1); }
  }
  .shake{
    animation:shake .45s ease;
  }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  .share-hint{
    display:none;
    margin-top:10px;
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    text-align:center;
  }

  .result{
    margin-top:12px;
    display:none;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{
    0%{opacity:0; transform:translateY(14px) scale(.92);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .luck-label{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:1px;
    margin-top:12px;
    margin-bottom:6px;
  }
  .ticker-wrap{
    position:relative;
    display:inline-block;
  }
  .ticker{
    font-size:26px;
    font-weight:800;
    color:var(--navy);
    letter-spacing:0.5px;
  }
  .sparkle{
    position:absolute;
    font-size:16px;
    opacity:0;
    pointer-events:none;
    animation:sparklePop 1s ease-out forwards;
  }
  .sparkle.s1{ top:-12px; left:-22px; animation-delay:.05s; }
  .sparkle.s2{ top:-16px; right:-22px; animation-delay:.2s; }
  .sparkle.s3{ bottom:-10px; left:50%; margin-left:-8px; animation-delay:.35s; }
  @keyframes sparklePop{
    0%{ opacity:0; transform:scale(.3) rotate(-10deg); }
    40%{ opacity:1; transform:scale(1.15) rotate(5deg); }
    100%{ opacity:0; transform:scale(.9) rotate(0deg); }
  }
  .detail-hint{
    position:relative;
    display:inline-block;
    overflow:hidden;
    margin-top:10px;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--blue-dark),var(--navy));
    padding:7px 18px;
    border-radius:999px;
  }
  .detail-hint:hover{
    background:linear-gradient(135deg,#4c5c8f,#1f2a4d);
  }
  .detail-hint::after{
    content:'';
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    animation:shine 2.5s ease-in-out infinite;
  }
  @keyframes shine{
    0%{ left:-60%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }
  .kr-name{
    font-size:14px;
    color:#5b6786;
    margin-top:5px;
    font-weight:600;
  }
  .flavor{
    margin-top:2px;
    font-size:15px;
    font-weight:400;
    line-height:1.5;
    color:#42506e;
    background:#f4f6fc;
    border-radius:14px;
    padding:11px 14px;
    white-space:pre-line;
  }
  .disclaimer{
    margin-top:14px;
    font-size:11px;
    color:#9aa3b8;
    text-align:center;
    line-height:1.4;
  }
  footer{
    text-align:center;
    color:#c9d2ec;
    font-size:11px;
    margin-top:10px;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(16px);
    background:rgba(43,58,103,0.94);
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:12px 22px;
    border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:1000;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="sky">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <h1>송편 주식운세</h1>
    <p class="subtitle">초스가 정성껏 빚어주는 오늘의 행운 미국주식 🌕</p>
  </div>

  <div class="card">
    <div class="stage">
      <video id="mascotVideo" class="video-bob" src="assets/songpyeon.mp4" poster="assets/poster.jpg" playsinline preload="auto"></video>
      <div class="idle-hint" id="idleHint">버튼을 눌러 송편을 빚어보세요</div>
    </div>

    <button class="make-btn" id="makeBtn">🥟 송편 빚기</button>

    <div class="result" id="result">
      <div class="flavor" id="flavorOut"></div>
      <div class="luck-label">오늘의 행운 종목</div>
      <div class="ticker-wrap">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">✨</span>
        <span class="sparkle s3">✨</span>
        <div class="ticker" id="tickerOut">-</div>
      </div>
      <div class="kr-name" id="nameOut">-</div>
      <a class="detail-hint" id="tickerLink" href="#" target="_blank" rel="noopener">종목 자세히보기 →</a>
    </div>

    <div class="btn-row" id="btnRow">
      <button class="again-btn" id="againBtn">다시 송편빚기</button>
      <button class="share-btn" id="shareBtn">공유하기</button>
    </div>
    <p class="share-hint" id="shareHint">공유하면 다시 빚기 1회가 추가돼요!</p>

    <p class="disclaimer">* 이 콘텐츠는 추석 재미 콘텐츠이며 투자 조언이 아닙니다.<br>투자 판단과 책임은 본인에게 있습니다.</p>
  </div>

  <footer>Happy Chuseok 🌕 with 초스</footer>
</div>

<div class="toast" id="toast"></div>

<script>

const video = document.getElementById('mascotVideo');
video.playbackRate = 1.8;
const makeBtn = document.getElementById('makeBtn');
const btnRow = document.getElementById('btnRow');
const againBtn = document.getElementById('againBtn');
const shareBtn = document.getElementById('shareBtn');
const shareHint = document.getElementById('shareHint');
const result = document.getElementById('result');
const idleHint = document.getElementById('idleHint');
const tickerLink = document.getElementById('tickerLink');
const tickerOut = document.getElementById('tickerOut');
const nameOut = document.getElementById('nameOut');
const flavorOut = document.getElementById('flavorOut');
const toast = document.getElementById('toast');

let toastTimer;
function showToast(msg, duration = 2200){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

const FREE_REMAKES = 1;
const MAX_SHARE_BONUS = 1;
let remakeCount = 0;
let bonusRemakes = 0;
let shareBonusUsed = false;

function remakesLeft(){
  return FREE_REMAKES + bonusRemakes - remakeCount;
}

function updateAgainState(){
  const left = remakesLeft();
  againBtn.classList.toggle('is-disabled', left <= 0);
  shareBtn.disabled = shareBonusUsed;
  if(left <= 0){
    shareHint.style.display = 'block';
    shareHint.textContent = shareBonusUsed
      ? '무료 재도전 횟수를 모두 사용했어요!'
      : '공유하면 다시 빚기 1회가 추가돼요!';
  }else{
    shareHint.style.display = 'none';
  }
}

function pickStock(){
  const [ticker, name] = stocks[Math.floor(Math.random()*stocks.length)];
  const sector = sectorOf[ticker];
  const pool = sector ? flavorsBySector[sector].concat(flavors) : flavors;
  const flavor = pool[Math.floor(Math.random()*pool.length)];
  tickerOut.textContent = ticker;
  nameOut.textContent = name;
  flavorOut.textContent = flavor;
  const utm = "utm_source=songpyeon-stock&utm_medium=referral&utm_campaign=chuseok";
  tickerLink.href = "https://www.choicestock.co.kr/search/summary/" + ticker + "?" + utm;
}

function showResult(){
  pickStock();
  result.style.display = 'block';
  makeBtn.style.display = 'none';
  btnRow.style.display = 'flex';
  updateAgainState();
}

function resetToIdle(){
  makeBtn.disabled = false;
  idleHint.style.display = 'block';
}

function playMaking(){
  makeBtn.disabled = true;
  idleHint.style.display = 'none';
  result.style.display = 'none';
  btnRow.style.display = 'none';
  shareHint.style.display = 'none';
  video.currentTime = 0;
  const playPromise = video.play();
  if(playPromise && playPromise.catch){
    playPromise.catch(() => {
      // 재생이 막히면(자동재생 정책 등) 바로 결과를 보여줌
      showResult();
    });
  }
}

video.addEventListener('ended', showResult);

video.addEventListener('error', () => {
  // 영상을 불러오지 못한 경우 안내 후 초기 상태로 복귀
  alert('영상을 불러오지 못했어요. index.html과 assets 폴더가 같은 위치에 있는지 확인해주세요.');
  resetToIdle();
});

function pulse(btn){
  btn.classList.remove('btn-pulse');
  void btn.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
  btn.classList.add('btn-pulse');
}
function shakeEl(el){
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}
[makeBtn, againBtn, shareBtn].forEach(btn => {
  btn.addEventListener('click', () => pulse(btn));
});

makeBtn.addEventListener('click', playMaking);

againBtn.addEventListener('click', () => {
  if(remakesLeft() <= 0){
    shakeEl(againBtn);
    return;
  }
  remakeCount++;
  playMaking();
});

function grantShareBonus(){
  if(shareBonusUsed) return;
  bonusRemakes = Math.min(bonusRemakes + 1, MAX_SHARE_BONUS);
  shareBonusUsed = true;
  updateAgainState();
}

shareBtn.addEventListener('click', async () => {
  if(shareBonusUsed) return;
  const ticker = tickerOut.textContent;
  const name = nameOut.textContent;
  const shareText = `초스가 빚어준 오늘의 행운 미국주식은 ${ticker}(${name})! 너의 행운 종목도 뽑아봐 🥟🌕`;
  const shareUrl = location.href;
  const fullText = `${shareText}\n${shareUrl}`;

  if(navigator.share){
    try{
      await navigator.share({ title:'송편 주식운세', text:shareText, url:shareUrl });
      showToast('공유했어요!');
      grantShareBonus();
    }catch(e){
      // 공유 시트를 취소한 경우 - 보너스 지급 안 함
    }
    return;
  }

  try{
    if(!(navigator.clipboard && navigator.clipboard.writeText)) throw new Error('no-clipboard');
    await navigator.clipboard.writeText(fullText);
    showToast('링크를 복사했어요!');
  }catch(e){
    prompt('아래 문구를 길게 눌러 복사한 뒤 공유해보세요 🥟', fullText);
  }
  grantShareBonus();
});

  starsWrap.appendChild(s);
}
